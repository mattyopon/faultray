name: OWASP ZAP Baseline Scan

# Scans production (faultray.com). Not on push: in the monorepo most main
# pushes don't touch the site, and a push-time scan races the Vercel deploy
# and hits the previous build. Weekly + on demand instead.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://faultray.com"
          fail_action: false
          artifact_name: zap-report

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report-${{ github.sha }}
          path: report_html.html
          retention-days: 30
