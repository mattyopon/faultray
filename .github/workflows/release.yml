name: Release

# Single trigger: a published GitHub Release. The former `push: tags: v*`
# trigger fired a second run for the same version (scripts/release.sh pushes
# the tag, then creates the Release) and also fired on non-release tags such
# as the floating `v1` GitHub Action tag.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -x --tb=short

  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from release
        id: get_version
        env:
          # CWE-78: pass the attacker-influenceable release tag via env and
          # reference it quoted, never interpolate ${{ ... }} into the shell.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Only vX.Y.Z releases publish; a Release cut from any other tag
          # (e.g. the floating `v1` Action tag) must not reach PyPI/GHCR.
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Not a vX.Y.Z release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          PKG_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match pyproject version $PKG_VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${VERSION}"

  # ----------------------------------------------------------------------
  # PyPI publish + SBOM + SLSA provenance attestation (#95)
  # ----------------------------------------------------------------------
  publish-pypi:
    needs: [test, extract-version]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write         # OIDC for Trusted Publisher + sigstore
      contents: write         # attach artifacts to GitHub Release
      attestations: write     # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          set -euo pipefail
          pip install build
          python -m build
          ls -la dist/

      - name: Generate CycloneDX SBOM for Python package
        # anchore/sbom-action wraps syft. Produces both SPDX and CycloneDX
        # output formats on the dist/ directory.
        uses: anchore/sbom-action@v0
        with:
          path: dist/
          format: cyclonedx-json
          artifact-name: faultray-${{ needs.extract-version.outputs.version }}-python.cdx.json
          output-file: dist/faultray-${{ needs.extract-version.outputs.version }}-python.cdx.json

      - name: Attest build provenance (SLSA v1)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"

      - name: Publish to PyPI via Trusted Publisher (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # scripts/release.sh uploads with twine before creating the Release;
          # don't fail the run (and skip the asset upload) on that duplicate.
          skip-existing: true

      - name: Attach wheel + sdist + SBOM to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json

  # ----------------------------------------------------------------------
  # Docker publish + cosign sign + SBOM (#95)
  # ----------------------------------------------------------------------
  publish-docker:
    needs: [test, extract-version]
    runs-on: ubuntu-latest
    permissions:
      packages: write         # push to ghcr.io
      contents: write         # attach SBOM to release
      id-token: write         # cosign OIDC keyless signing
      attestations: write     # SLSA provenance
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: v${{ needs.extract-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign (sigstore)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Build & push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest

      - name: Sign container image (sigstore keyless)
        run: |
          set -euo pipefail
          # Sign by digest to pin the exact image bytes
          cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Generate CycloneDX SBOM for Docker image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          format: cyclonedx-json
          artifact-name: faultray-${{ needs.extract-version.outputs.version }}-docker.cdx.json
          output-file: faultray-${{ needs.extract-version.outputs.version }}-docker.cdx.json

      - name: Attach SBOM to Docker image (cosign attest)
        run: |
          set -euo pipefail
          cosign attest --yes \
            --predicate "faultray-${VERSION}-docker.cdx.json" \
            --type cyclonedx \
            "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.extract-version.outputs.version }}

      - name: Attest Docker build provenance (SLSA v1)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attach Docker SBOM to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            faultray-${{ needs.extract-version.outputs.version }}-docker.cdx.json
